# Zulässige Lizenzen der Rust-Abhängigkeiten (cargo about, siehe
# scripts/third-party-licenses.mjs). Alle sind mit der MIT-Lizenz von
# StarCLX vereinbar; GPL-Lizenzen stehen bewusst nicht darauf.
targets = ["x86_64-unknown-linux-gnu"]
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "Unlicense",
    "bzip2-1.0.6",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
