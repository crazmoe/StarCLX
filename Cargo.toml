[workspace]
resolver = "3"
members = ["crates/*", "apps/sfctl", "apps/desktop/src-tauri"]

[workspace.package]
version = "1.6.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/crazmoe/StarCLX"

[workspace.dependencies]
sf-proto = { path = "crates/sf-proto" }
sf-auth = { path = "crates/sf-auth" }
sf-onehub = { path = "crates/sf-onehub" }
sf-core = { path = "crates/sf-core" }
sf-tls = { path = "crates/sf-tls" }
sf-backoff = { path = "crates/sf-backoff" }
sf-doorcam = { path = "crates/sf-doorcam" }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
