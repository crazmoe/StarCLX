# Wöchentliche Updates, je Bereich ein Sammel-PR für Minor- und Patch-Versionen;
# Major-Versionen kommen einzeln, weil sie eher Anpassungen brauchen.
# Die Submodule unter crates/sf-sip/vendor bleiben bewusst aussen vor.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
    ignore:
      # 2.6.2 kompiliert unter Linux nicht mit rust-ini 0.21.3 (ParseOption hat neue Pflichtfelder).
      - dependency-name: tauri-plugin-deep-link
        versions: ["2.6.2"]
      # zbus 6 bringt eine neue API; Tauri, keyring und notify-rust hängen noch an zbus 5.
      - dependency-name: zbus
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
