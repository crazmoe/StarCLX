[package]
name = "sf-support"
description = "Fehlerberichte an die Sammelstelle der Firma: Vorgaben, Bereinigung (Nummern, Namen, Zugangsdaten), Versand, Warteordner, Flut-Schutz"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
regex = "1"
flate2 = "1"
hmac = "0.12"
sha2 = "0.10"
gethostname = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true }
