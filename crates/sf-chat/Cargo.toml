[package]
name = "sf-chat"
description = "Chat der Anlage über XMPP (Openfire, Token als Passwort)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sf-backoff.workspace = true
sf-tls.workspace = true
tokio-rustls = { version = "0.26", default-features = false }
sasl = { version = "0.5", default-features = false }
tokio-xmpp = { version = "6", default-features = false, features = ["starttls", "aws_lc_rs", "rustls-native-certs"] }
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
